<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Opportunity Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Research Opportunity Portal</h1>
    <p>Browse and manage research opportunities offered by faculty</p>
  </header>

  <main class="container">
    <!-- Success and error messages appear here -->
    <div id="message" class="message" hidden></div>

    <!-- Section 1: list of all opportunities -->
    <section id="list-section">
      <div class="list-header">
        <h2>All Opportunities</h2>
        <button id="new-button">+ Add New Opportunity</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Research Area</th>
              <th>Faculty</th>
              <th>Positions</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="opportunity-list"></tbody>
        </table>
      </div>
      <p id="empty-text" hidden>No opportunities found.</p>
    </section>

    <!-- Section 2: details of one opportunity -->
    <section id="details-section" hidden>
      <h2>Opportunity Details</h2>
      <div id="details-content"></div>
      <button id="details-back-button" class="secondary">Back to List</button>
    </section>

    <!-- Section 3: form to add an opportunity -->
    <section id="form-section" hidden>
      <h2>Add New Opportunity</h2>

      <!-- Validation problems are listed here -->
      <div id="form-errors" class="message error" hidden></div>

      <form id="opportunity-form" novalidate>
        <label for="title">Research title</label>
        <input type="text" id="title" maxlength="200">

        <label for="description">Description</label>
        <textarea id="description" maxlength="5000"></textarea>

        <label for="research_area">Research area</label>
        <input type="text" id="research_area" maxlength="100">

        <label for="faculty_name">Faculty name</label>
        <input type="text" id="faculty_name" maxlength="100">

        <label for="department">Department</label>
        <input type="text" id="department" maxlength="100">

        <label for="required_skills">Required skills</label>
        <input type="text" id="required_skills" maxlength="255" placeholder="For example: Python, SQL">

        <label for="available_positions">Available positions</label>
        <input type="number" id="available_positions" min="0" step="1">

        <label for="application_deadline">Application deadline</label>
        <input type="date" id="application_deadline">

        <label for="status">Status</label>
        <select id="status">
          <option value="Open">Open</option>
          <option value="Closed">Closed</option>
        </select>

        <div class="form-buttons">
          <button type="submit" id="save-button">Save Opportunity</button>
          <button type="button" id="cancel-button" class="secondary">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
